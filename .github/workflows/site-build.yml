name: Site build check

on:
  pull_request:
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'
  push:
    branches-ignore: [main]
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
